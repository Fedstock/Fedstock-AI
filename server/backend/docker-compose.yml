services:
  db:
    image: postgres:17-alpine
    container_name: fedstock-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fedstock
      POSTGRES_USER: fedstock
      POSTGRES_PASSWORD: fedstock
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedstock -d fedstock"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fedstock-backend:local
    container_name: fedstock-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fedstock
      DB_USERNAME: fedstock
      DB_PASSWORD: fedstock
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
